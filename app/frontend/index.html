<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask your database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --fg:#fff; --mid:#a1a1a1; --dim:#5c5c5c; --line:#1f1f1f; --line2:#333; --bad:#ff5c5c;
  --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--fg);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
.wrap{max-width:880px;margin:0 auto;padding:0 24px}
header{display:flex;justify-content:space-between;align-items:center;padding:28px 0;gap:16px}
.mark{font-weight:600;letter-spacing:-.02em}
.who{display:flex;align-items:center;gap:16px;color:var(--dim);font-size:14px}
.link{color:var(--mid);font-size:14px;border-bottom:1px solid var(--line2);padding-bottom:1px}
.link:hover{color:var(--fg);border-color:var(--fg)}
h1{font-weight:500;font-size:clamp(2.8rem,9vw,6.4rem);line-height:.95;letter-spacing:-.055em;margin:9vh 0 48px}
h1 span{color:var(--dim)}
.ask{border-bottom:1px solid var(--line2);transition:border-color .2s}
.ask:focus-within{border-color:var(--fg)}
textarea{display:block;width:100%;background:none;border:0;resize:none;outline:0;font-size:clamp(1.15rem,2.6vw,1.5rem);letter-spacing:-.015em;line-height:1.4;padding:8px 0 18px;min-height:64px}
textarea::placeholder{color:var(--dim)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0 0;flex-wrap:wrap}
.hint{color:var(--dim);font-size:13px}
.run{background:var(--fg);color:var(--bg);font-weight:500;padding:10px 22px;border-radius:999px;transition:transform .15s,opacity .15s}
.run:hover{transform:translateY(-1px)}
.run[disabled]{opacity:.4;cursor:progress;transform:none}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.sugg button{border:1px solid var(--line2);border-radius:999px;padding:6px 14px;font-size:14px;color:var(--mid);transition:.15s}
.sugg button:hover{color:var(--fg);border-color:var(--fg)}
#out{margin:72px 0 40px}
.load{height:1px;background:linear-gradient(90deg,transparent,var(--fg),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:sweep 1s linear infinite;margin-bottom:-1px}
@keyframes sweep{from{background-position:-40% 0}to{background-position:140% 0}}
.verdict{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line)}
.verdict h2{font-size:1.6rem;font-weight:500;letter-spacing:-.03em}
.verdict h2.no{color:var(--bad)}
.verdict p{color:var(--mid);font-size:14px}
.question-card{margin-top:18px;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(135deg,#101510,#090909)}
.eyebrow{display:block;color:var(--dim);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.question-card p{font-size:16px;line-height:1.55;overflow-wrap:anywhere}
.result-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px;color:var(--mid);font-size:13px}
.result-summary strong{color:var(--fg);font-weight:500}
.result-badge{border:1px solid #244333;background:#0d1a12;color:#9be3b6;border-radius:999px;padding:4px 9px;font-size:12px;white-space:nowrap}
.tbl{border-color:var(--line2);border-radius:10px}
tbody tr:nth-child(even){background:#080808}
tbody tr:hover{background:#111}
th{background:#090909;text-transform:none;letter-spacing:0}
details.disclosure{border:1px solid var(--line);border-radius:10px;padding:0 14px;margin-top:14px}
details.disclosure>summary{cursor:pointer;list-style:none;padding:14px 0;color:var(--mid);font-size:14px}
details.disclosure>summary::-webkit-details-marker{display:none}
details.disclosure>summary:after{content:'＋';float:right;color:var(--dim)}
details.disclosure[open]>summary:after{content:'−'}
details.disclosure .sec{padding:14px 0;border-bottom:0}
.sec{padding:28px 0;border-bottom:1px solid var(--line)}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px}
.sec-h h3{font-size:14px;font-weight:500;color:var(--mid)}
.tabs{display:flex;gap:16px}
.tabs button{font-size:14px;color:var(--dim);padding-bottom:2px;border-bottom:1px solid transparent}
.tabs button[aria-pressed=true]{color:var(--fg);border-color:var(--fg)}
pre{font:400 14px/1.7 var(--mono);color:var(--mid);white-space:pre-wrap;word-break:break-word}
pre b{color:var(--fg);font-weight:500}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:24px}
.checks dt{color:var(--dim);font-size:13px}
.checks dd{font-size:1.15rem;font-weight:500;letter-spacing:-.02em;margin-top:2px}
.checks dd.no{color:var(--bad)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:11px 16px;white-space:nowrap;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:400;font-size:13px}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--mono)}
td.nul{color:var(--dim)}
.msgs li{list-style:none;padding:10px 0;font-size:14px;color:var(--mid);border-bottom:1px solid var(--line)}
.msgs li:last-child{border:0}
.msgs code{font:400 12px var(--mono);color:var(--bad);margin-right:8px}
.msgs.warn code{color:var(--mid)}
.hist{margin:24px 0 80px}
.hist h3{font-size:14px;font-weight:500;color:var(--dim);margin-bottom:8px}
.hist button{width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line);color:var(--mid);font-size:15px;display:flex;justify-content:space-between;gap:16px}
.hist button:hover{color:var(--fg)}
.hist small{color:var(--dim);font-size:13px;flex:none}
.hist small.no{color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<!-- Hidden until we confirm the user is signed in, so there's no flash of the app. -->
<div class="wrap" id="app" hidden>
  <header>
    <span class="mark">Ask SQL</span>
    <div class="who">
      <span id="user-email"></span>
      <button class="link" id="signout">Sign out</button>
    </div>
  </header>

  <h1>Ask your<br><span>database.</span></h1>

  <div class="ask">
    <textarea id="q" rows="2" placeholder="Describe the data you want, in plain English" aria-label="Your question" autofocus></textarea>
  </div>
  <div class="bar">
    <span class="hint">Read-only. Only SELECT queries run.</span>
    <button class="run" id="run">Run query</button>
  </div>
  <div class="sugg" id="sugg"></div>

  <section id="out" aria-live="polite"></section>
  <section class="hist" id="hist" hidden><h3>This session</h3><div id="hist-list"></div></section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
const API_URL = '/api/v1/query';   // same origin as this page, so no CORS needed

/* ---------- Auth guard ---------- */
const toLogin = () => location.replace('/login.html');

sb.auth.getSession().then(({ data }) => {
  if (!data.session) return toLogin();
  $('#user-email').textContent = data.session.user.email || '';
  $('#app').hidden = false;
  q.focus();
});

// Fires when the user signs out (here or in another tab) or the session can't be refreshed.
sb.auth.onAuthStateChange((event, session) => { if (!session) toLogin(); });

$('#signout').addEventListener('click', () => sb.auth.signOut());

/* ---------- App ---------- */
const q = $('#q'), run = $('#run'), out = $('#out');
const history = [];
const SUGGESTIONS = ["give me all the product categories", "how many products are in each category", "show the 5 most expensive products", "create an empty table named users"];

SUGGESTIONS.forEach(t => {
  const b = document.createElement('button'); b.textContent = t;
  b.onclick = () => { q.value = t; ask(); };
  $('#sugg').appendChild(b);
});

const KW = /\b(SELECT|FROM|WHERE|GROUP BY|ORDER BY|LIMIT|OFFSET|JOIN|LEFT|RIGHT|INNER|OUTER|ON|AS|AND|OR|NOT|IN|UNION|ALL|COUNT|SUM|AVG|MIN|MAX|DESC|ASC|HAVING|DISTINCT|LIKE|IS|NULL|BETWEEN|CASE|WHEN|THEN|ELSE|END)\b/gi;
const hl = sql => sql.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(KW,'<b>$1</b>');

function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

const explain = code => ({
  DISALLOWED_STATEMENT_TYPE: 'This statement type is blocked. Only SELECT and UNION queries are allowed.',
}[code] || null);

function autosize() { q.style.height = 'auto'; q.style.height = Math.max(64, q.scrollHeight) + 'px'; }
q.addEventListener('input', autosize);
q.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey || !e.shiftKey)) { e.preventDefault(); ask(); } });
run.addEventListener('click', ask);

function showError(title, message) {
  const box = el('div'), v = el('div', 'verdict');
  v.append(el('h2', 'no', title), el('p', null, message));
  box.append(v); out.replaceChildren(box);
}

async function ask() {
  const question = q.value.trim();
  if (!question || run.disabled) return;

  // getSession() auto-refreshes the token if it's close to expiring.
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return toLogin();

  run.disabled = true; run.textContent = 'Running…';
  out.replaceChildren(el('div', 'load'));
  let reached = false;
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + session.access_token,
      },
      body: JSON.stringify({ question }),
    });

    // Token rejected by the API: end the session and go back to login.
    if (res.status === 401) { await sb.auth.signOut(); return; }

    if (res.status === 403) { showError('Not allowed', 'Your account does not have access to this.'); return; }
    if (res.status === 429) { showError('Too many requests', 'Wait a moment and try again.'); return; }

    let data; try { data = await res.json(); } catch (e) { throw new Error('The server answered with something that isn’t JSON (HTTP ' + res.status + ').'); }
    if (!res.ok && !data.question) throw new Error(typeof data.detail === 'string' ? data.detail : 'The server returned HTTP ' + res.status + '.');
    reached = true;
    render(data);
    history.unshift({ question, ok: !!(data.execution_result && data.execution_result.success), refused: data.generated_sql === 'REFUSAL' || !data.is_safe });
    renderHistory();
  } catch (err) {
    showError(
      reached ? 'Couldn’t display the response' : 'Couldn’t reach the API',
      reached ? err.message : err instanceof TypeError ? 'Check that the server is running and reachable.' : err.message
    );
  } finally { run.disabled = false; run.textContent = 'Run query'; }
}

function render(d) {
  const ex = d.execution_result, refused = d.generated_sql === 'REFUSAL' || !d.is_safe || !ex;
  const root = el('div');

  const v = el('div', 'verdict');
  if (ex && ex.success) {
    v.append(el('h2', null, ex.row_count + (ex.row_count === 1 ? ' row' : ' rows')));
    v.append(el('p', null, 'Ran in ' + ex.execution_time_ms.toFixed(0) + ' ms'));
  } else if (refused) {
    v.append(el('h2', 'no', 'Refused'));
    v.append(el('p', null, 'Nothing was run against the database.'));
  } else {
    v.append(el('h2', 'no', 'Query couldn’t be completed'));
    v.append(el('p', null, 'Please rephrase your question and try again.'));
  }
  root.append(v);

  const prompt = el('div', 'question-card');
  prompt.append(el('span', 'eyebrow', 'Your question'), el('p', null, d.question || 'Query results'));
  root.append(prompt);

  if (ex && ex.success && ex.rows.length) {
    const s2 = el('div', 'sec'); const h = el('div', 'sec-h'); h.append(el('h3', null, 'Results')); s2.append(h);
    const summary = el('div', 'result-summary');
    summary.append(el('span', null, 'Showing ' + ex.rows.length + ' ' + (ex.rows.length === 1 ? 'row' : 'rows')),
      el('span', 'result-badge', 'Ready'));
    const wrap = el('div', 'tbl'), t = el('table'), thead = el('thead'), tr = el('tr');
    const isNum = c => ex.rows.every(r => r[c] == null || typeof r[c] === 'number');
    ex.columns.forEach(c => tr.append(el('th', isNum(c) ? 'n' : '', c))); thead.append(tr); t.append(thead);
    const tb = el('tbody');
    ex.rows.forEach(r => { const row = el('tr'); ex.columns.forEach(c => { const val = r[c]; row.append(el('td', val == null ? 'nul' : isNum(c) ? 'n' : '', val == null ? 'null' : typeof val === 'object' ? JSON.stringify(val) : String(val))); }); tb.append(row); });
    t.append(tb); wrap.append(t); s2.append(summary, wrap); root.append(s2);
  } else if (ex && ex.success) {
    const s2 = el('div', 'sec'); s2.append(el('h3', null, 'Results'), el('p', null, 'The query ran successfully but returned no matching rows.')); root.append(s2);
  }

  out.replaceChildren(root);
}

function renderHistory() {
  const box = $('#hist-list'); box.replaceChildren();
  history.slice(0, 8).forEach(h => {
    const b = el('button'); b.append(el('span', null, h.question), el('small', h.refused ? 'no' : '', h.refused ? 'Refused' : h.ok ? 'Ran' : 'Failed'));
    b.onclick = () => { q.value = h.question; autosize(); q.focus(); };
    box.append(b);
  });
  $('#hist').hidden = !history.length;
}
</script>
</body>
</html>
